server:
  port: 8087
  servlet:
    context-path: '/ead-authuser/'

spring:
  application:
    name: ead-authuser-service
  datasource:
    url:  jdbc:postgresql://localhost:5432/authuser_db
    username: authuser
    password: authuser
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non-contextual-creation: false
  rabbitmq:
    uri: amqp://guest:guest@localhost:5672/my_vhost
  # profiles:
  #   active: dev

ead:
  api:
    course: 'http://ead-course-service/ead-course'
  broker:
    exchange:
      userEvent: ead.userevent

authuser:
  refreshscope:
    name: Leandro

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health            

logging:
  level:
    com.ead: TRACE
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate: INFO
    org.springframework.amqp: DEBUG
    org.springframework.amqp.rabbit.connection: DEBUG

#eureka:
